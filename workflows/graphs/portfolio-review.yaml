# Portfolio Review Workflow — Executable TaskGraph Definition
#
# Analyzes an existing portfolio's risk profile, checks performance,
# and generates rebalance recommendations.
#
# DAG Structure:
#   portfolio-load → [risk-analysis, performance-analysis] → rebalance → report

name: portfolio-review
version: "2.0.0"
description: >
  Review an existing investment portfolio. Analyze risk and performance
  per position, then generate rebalance recommendations.

config:
  max_retries: 2
  default_timeout: 60

nodes:
  - id: portfolio-load
    label: "Load Portfolio Holdings"
    skill: data-collector
    timeout: 30
    tags: [data]

  - id: risk-analysis
    label: "Position Risk Analysis"
    skill: risk-analysis
    timeout: 120
    tags: [analysis, parallel]

  - id: performance-analysis
    label: "Position Performance Analysis"
    skill: fundamental-analysis
    timeout: 120
    tags: [analysis, parallel]

  - id: rebalance
    label: "Rebalance Recommendation"
    skill: portfolio-selection
    timeout: 60
    tags: [orchestration]

  - id: report-generation
    label: "Portfolio Review Report"
    skill: report-generator
    timeout: 30
    tags: [reporting]

edges:
  - from: portfolio-load
    to: risk-analysis
  - from: portfolio-load
    to: performance-analysis
  - from: risk-analysis
    to: rebalance
  - from: performance-analysis
    to: rebalance
  - from: rebalance
    to: report-generation

entry_points: [portfolio-load]
output_nodes: [report-generation]
